name: Build VtuberLayers (Windows exe)

# Gera o VtuberLayers.exe numa maquina Windows do GitHub.
# Rode manualmente na aba "Actions" (botao "Run workflow") ou a cada push.
on:
  workflow_dispatch:
  push:
    paths:
      - "VtuberLayers/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r VtuberLayers/requirements.txt pyinstaller
          # Opcional: PSD nativo. Se nao instalar, o exe exporta .ora.
          pip install pytoshop || echo "pytoshop indisponivel; o exe usara .ora"

      - name: Compilar o .exe
        shell: bash
        run: |
          pyinstaller --onefile --windowed --name VtuberLayers \
            --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 \
            --exclude-module rembg --exclude-module onnxruntime \
            VtuberLayers/vtuber_layers.py

      - name: Publicar o resultado (artifact temporario)
        uses: actions/upload-artifact@v4
        with:
          name: VtuberLayers-windows
          path: dist/VtuberLayers.exe
          if-no-files-found: error

      - name: Publicar Release (link fixo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vtuberlayers-latest
          name: VtuberLayers (ultima versao)
          body: |
            Executavel do VtuberLayers para Windows, nao precisa instalar Python.
            Baixe o VtuberLayers.exe abaixo e de dois cliques.

            Observacoes:
            - A primeira abertura e lenta (o exe se descompacta).
            - Alguns antivirus dao falso-positivo em exe feito com PyInstaller.
            - "Remover fundo" automatico nao esta incluido; separe o fundo na mao.
          files: dist/VtuberLayers.exe
          make_latest: "true"
